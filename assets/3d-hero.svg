<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(248, 248, 242, 0.05)" stroke-width="1"/>
    </pattern>
    <!-- Cyberpunk Glows -->
    <radialGradient id="glow-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08D9D6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background (VOID) -->
  <rect width="800" height="400" fill="#0B0C10"/>
  <!-- Perspective Cyber Grid -->
  <g opacity="0.6">
    <rect width="800" height="400" fill="url(#grid)"/>
    <circle cx="400" cy="200" r="300" fill="url(#glow-pink)"/>
    <circle cx="200" cy="300" r="200" fill="url(#glow-cyan)"/>
  </g>

  <!-- 3D Centered Animation -->
  <g transform="translate(400, 200)">
    
    <!-- Outer Orbit (Purple) -->
    <g stroke-width="2" fill="none">
      <ellipse cx="0" cy="0" rx="300" ry="80" stroke="#7B2FF7" stroke-dasharray="150 100" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="300" cy="0" r="3" fill="#7B2FF7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Mid Orbit (Yellow) -->
    <g stroke-width="2" fill="none">
      <ellipse cx="0" cy="0" rx="200" ry="60" stroke="#FFD400" stroke-dasharray="80 120" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="200" cy="0" r="3" fill="#FFD400">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Inner Orbit (Cyan) -->
    <g stroke-width="2" fill="none">
      <ellipse cx="0" cy="0" rx="120" ry="35" stroke="#08D9D6" stroke-dasharray="30 40" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="120" cy="0" r="3" fill="#08D9D6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Swirling 3D Isohedral Node (Neon Pink / Cyan) -->
    <g transform="scale(1.5)">
      <!-- Spin Z -->
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <!-- Inner core geometry -->
      <polygon points="0,-40 34,-20 34,20 0,40 -34,20 -34,-20" fill="rgba(255, 46, 99, 0.15)" stroke="#FF2E63" stroke-width="1.5">
         <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="rgba(8, 217, 214, 0.2)" stroke="#08D9D6" stroke-width="1">
         <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </polygon>
      <!-- Connecting structural wires -->
      <g stroke="rgba(255, 46, 99, 0.5)" stroke-width="1">
        <line x1="0" y1="-40" x2="0" y2="40"/>
        <line x1="-34" y1="-20" x2="34" y2="20"/>
        <line x1="34" y1="-20" x2="-34" y2="20"/>
      </g>
    </g>

    <!-- Incoming / Outgoing particles (Data flow) -->
    <circle cx="-380" cy="20" r="4" fill="#FFD400">
      <animate attributeName="cx" values="-400;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="-20" r="4" fill="#08D9D6">
      <animate attributeName="cx" values="400;0" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="180" r="4" fill="#FF2E63">
      <animate attributeName="cy" values="200;0" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Typography UI overlay (Space Grotesk style) -->
  <text x="40" y="50" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="24" fill="#F8F8F2" letter-spacing="2">
    LLM_PRECLASSIFIER
  </text>
  <text x="40" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#08D9D6">
    VERIFIED ROUTING MATRIX
  </text>
  
  <text x="40" y="360" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFD400">
    STATUS: [ ONLINE ] 0MS LATENCY
  </text>

</svg>
