name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private prompts, provider account data, or personal information."
  - type: textarea
    id: behaviour
    attributes:
      label: Observed behaviour
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic content only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification performed
      description: Tests, environment, and any workaround.
