name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: pip install --no-cache-dir ".[dev]"

      - name: Test
        run: python -m pytest tests -v
      - name: Accuracy gate
        run: python -m llm_preclassifier.evaluation eval/dataset.jsonl --min-accuracy 0.8

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime -t llm-preclassifier:ci .

      - name: Smoke test — healthz
        run: |
          docker run -d --name smoke -p 18802:8802 llm-preclassifier:ci
          sleep 5
          curl -fsS http://localhost:18802/healthz
          docker rm -f smoke
