name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: pip install --no-cache-dir ".[dev]"

      - name: Test
        run: python -m pytest tests -v
      - name: Accuracy gate
        run: |
          python -m llm_preclassifier.evaluation eval/dataset.jsonl --min-accuracy 0.95
          python -m llm_preclassifier.evaluation eval/holdout.jsonl --min-accuracy 0.95
      - name: Blind benchmark (report only)
        run: |
          python -m llm_preclassifier.evaluation eval/blind.jsonl
          python -m llm_preclassifier.evaluation eval/blind-v2.jsonl

  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with semantic layer
        run: pip install --no-cache-dir ".[semantic,dev]"

      - name: Semantic unit tests
        run: python -m pytest tests/test_semantic.py -v

      - name: Semantic accuracy gate and blind benchmarks
        run: make eval-semantic PYTHON=python

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime-semantic -t llm-preclassifier:ci .

      - name: Smoke test — healthz
        run: |
          docker run -d --name smoke -p 18802:8802 llm-preclassifier:ci
          sleep 5
          curl -fsS http://localhost:18802/healthz
          docker rm -f smoke
