[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-preclassifier"
version = "0.1.0"
description = "Self-hosted, provider-neutral preflight classification for agent requests."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Sasindu Dilshan Ranwadana"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi==0.133.1",
  "pyyaml==6.0.3",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
semantic = [
  "fastembed==0.8.1",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/sasindudilshanranwadana/llm-preclassifier"
Repository = "https://github.com/sasindudilshanranwadana/llm-preclassifier"
Issues = "https://github.com/sasindudilshanranwadana/llm-preclassifier/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_preclassifier = ["data/*.json", "data/*.yaml"]
